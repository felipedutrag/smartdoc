<svg
  width="512"
  height="512"
  viewBox="0 0 100 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Gradiente Ouro & Âmbar Imperial (Face Sombra) -->
    <linearGradient id="sd-pen-gold-left" x1="10%" y1="5%" x2="50%" y2="95%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="35%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>
    <!-- Gradiente Ouro Polido (Face Luz) -->
    <linearGradient id="sd-pen-gold-right" x1="90%" y1="5%" x2="50%" y2="95%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="25%" stopColor="#fef08a" />
      <stop offset="60%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>
  </defs>

  <!-- Fundo Escuro Squircle Luxuoso -->
  <rect width="100" height="100" rx="22" fill="#09090b" />
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="#27272a" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- A Caneta Tinteiro de Pena Centralizada -->
  <g transform="translate(16, 13) scale(2.15)">
    <!-- Lâmina Esquerda da Pena -->
    <path
      d="M16 2.5C14.8 6.8 7.5 12.5 7.5 18C7.5 22.8 10 28 10.5 30H16V2.5Z"
      fill="url(#sd-pen-gold-left)"
    />

    <!-- Lâmina Direita da Pena (Reflexo de Luz) -->
    <path
      d="M16 2.5C17.2 6.8 24.5 12.5 24.5 18C24.5 22.8 22 28 21.5 30H16V2.5Z"
      fill="url(#sd-pen-gold-right)"
    />

    <!-- Filigrana / Gravura Nobre da Pena -->
    <path
      d="M11 25.5C11 20 13.5 16 16 16C18.5 16 21 20 21 25.5"
      stroke="#78350f"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.5"
    />

    <!-- Fenda Central de Tinteiro (Slit) -->
    <path
      d="M16 2.5V15.5"
      stroke="#09090b"
      stroke-width="1.3"
      stroke-linecap="round"
    />

    <!-- Furo de Respiro Central (Breather Hole) -->
    <circle
      cx="16"
      cy="16"
      r="1.8"
      fill="#09090b"
    />

    <!-- Ponta de Irídio de Alta Definição -->
    <path
      d="M15 2.5H17L16 1.2L15 2.5Z"
      fill="#ffffff"
    />
  </g>
</svg>
