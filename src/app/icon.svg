<svg
  width="512"
  height="512"
  viewBox="0 0 100 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="sd-fav-quill-left" x1="15%" y1="10%" x2="50%" y2="90%">
      <stop offset="0%" stopColor="#fb923c" />
      <stop offset="100%" stopColor="#ea580c" />
    </linearGradient>
    <linearGradient id="sd-fav-quill-right" x1="50%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stopColor="#fed7aa" />
      <stop offset="50%" stopColor="#fb923c" />
      <stop offset="100%" stopColor="#f97316" />
    </linearGradient>
  </defs>

  <!-- Fundo Escuro Squircle Luxuoso -->
  <rect width="100" height="100" rx="22" fill="#09090b" />
  <rect width="98" height="98" x="1" y="1" rx="21" stroke="#27272a" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- A Pena Forense Centralizada -->
  <g transform="translate(16, 14) scale(2.1)">
    <!-- Lâmina Esquerda -->
    <path
      d="M16 2.5C16 2.5 7.5 9.5 7.5 18C7.5 22.6944 11.3056 26.5 16 29.5V2.5Z"
      fill="url(#sd-fav-quill-left)"
    />
    <!-- Lâmina Direita -->
    <path
      d="M16 2.5C16 2.5 24.5 9.5 24.5 18C24.5 22.6944 20.6944 26.5 16 29.5V2.5Z"
      fill="url(#sd-fav-quill-right)"
      opacity="0.9"
    />
    <!-- Fenda Central de Tinteiro -->
    <path
      d="M16 9V23"
      stroke="#09090b"
      stroke-width="1.8"
      stroke-linecap="round"
    />
    <!-- Vértice Circular de Respiro -->
    <circle cx="16" cy="23" r="1.8" fill="#09090b" />
  </g>
</svg>
